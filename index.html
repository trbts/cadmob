<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d5cab">
<title>Cadastro Imobiliário · Careiro</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0d5cab 0%, #083d73 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;padding:24px;-webkit-font-smoothing:antialiased;
  }
  .box{text-align:center;max-width:360px;width:100%}
  .logo{
    width:68px;height:68px;border-radius:20px;margin:0 auto 22px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    display:grid;place-items:center;font-weight:800;font-size:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.22);
  }
  .spin{
    width:36px;height:36px;border-radius:50%;
    border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
    margin:0 auto 16px;animation:s .8s linear infinite;
  }
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:16.5px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
  p{font-size:13px;opacity:.85;line-height:1.5}
  .org{
    font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.9px;opacity:.7;margin-top:22px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">CI</div>
    <div class="spin"></div>
    <h1>Carregando…</h1>
    <p id="msg">Verificando sua sessão, aguarde um instante.</p>
    <div class="org">Prefeitura Municipal de Careiro</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDgJC2zYMBW6zKOPDnxUkIxP-ko_NTaNjw",
  authDomain: "cadmob.firebaseapp.com",
  projectId: "cadmob",
  storageBucket: "cadmob.firebasestorage.app",
  messagingSenderId: "301431109388",
  appId: "1:301431109388:web:e487b8e8236a6bee9a7b29"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ============================================================
   ROTEAMENTO
   ------------------------------------------------------------
   O index só decide entre DOIS destinos:
     • formulario.html        → usuário com acesso liberado
     • formulario-login.html  → qualquer outro caso
   ============================================================ */

/* Roles que podem entrar no Painel de Formulários */
const FORM_ROLES = ['funcionario', 'admin', 'superadmin'];

function go(url){
  window.location.replace(url);
}

onAuthStateChanged(auth, async (user) => {

  // 1) Sem sessão → tela de login do formulário
  if(!user){
    go('formulario-login.html');
    return;
  }

  // 2) Com sessão → verifica a role no Firestore
  try {
    const snap = await getDoc(doc(db, 'usuarios', user.uid));
    const role = snap.exists()
      ? String(snap.data().role || 'user').toLowerCase()
      : 'user';

    // 3) Role com acesso liberado → Painel de Formulários
    if(FORM_ROLES.includes(role)){
      go('formulario.html');
      return;
    }

    // 4) Role pendente ('user') ou desconhecida → login do formulário
    //    (a tela de login mostrará a mensagem "Acesso pendente")
    go('formulario-login.html');

  } catch(err){
    console.error('[index] erro ao verificar role:', err);
    // Em caso de erro de conexão, manda para o login
    go('formulario-login.html');
  }
});
</script>
</body>
</html>
